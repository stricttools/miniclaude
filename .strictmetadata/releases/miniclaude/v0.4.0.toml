# The next release of miniclaude. Fill in bump and description, then run `rlsbl release run --watch`.
format_version = 2
# How the release moves the version: patch, minor, major, or infra (moved as a patch, recorded as infra).
bump = "minor"
# What this release is, in a sentence or two. Required.
description = "miniclaude rewritten in Go: the same fullscreen REPL on its own terminal layer, sessions started through claudewheel profile exec with claudestream 0.16.0, the prompt history moved to the XDG state directory with an import command, and a command installed with go install or from the release archives. The Python and npm packages are no longer published; PyPI and npm keep 0.3.0."
# Why these changes were made. Optional.
context = "The stricttools projects are moving to Go; the Python and npm releases stop at 0.3.0."
# The targets released, and the ones left out; between them they name every target of the releasable's members.
include = ["go"]
exclude = []
release_commit = "2bc6a48b78ee9b114d0d0156960cc1603467d30e"
[released_trees]
"." = "4692244a5fff6fbe4fdd50169c818bb58131d0f8"
